[package]
name = "sorolint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Sorolint smart contract scanner"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[[bin]]
name = "sorolint"
path = "src/main.rs"

[dependencies]
sorolint-analyzer = { path = "../analyzer", version = "0.1.0" }
sorolint-checks = { path = "../checks", version = "0.1.0" }
clap.workspace = true
clap_complete = "4.5"
colored.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
notify = "6"
